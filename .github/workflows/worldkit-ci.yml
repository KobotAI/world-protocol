name: WorldKit CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  WORLDKIT_VERSION: 0.0.0-ci.${{ github.run_id }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Stage, inspect and pack release artifacts
        run: |
          node scripts/worldkit/stage-release.mjs "$WORLDKIT_VERSION"
          node scripts/worldkit/inspect-release.mjs "$WORLDKIT_VERSION"
          node scripts/worldkit/pack-release.mjs
      - name: Verify packed artifacts from a clean consumer
        run: node scripts/worldkit/verify-consumer.mjs
