name: Remote Level 1 conformance

on:
  workflow_dispatch:
    inputs:
      world:
        description: Public World Protocol origin to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  level-1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build WorldDevKit
        run: pnpm build
      - name: Run documented client quickstart
        env:
          WORLD_URL: ${{ inputs.world }}
        run: pnpm --dir examples/client-node quickstart -- "$WORLD_URL"
      - name: Check remote World Protocol Level 1 conformance
        env:
          WORLD_URL: ${{ inputs.world }}
          WORLDKIT_CONFORMANCE_TIMEOUT_MS: '600000'
        run: node scripts/worldkit/check-live-level1.mjs "$WORLD_URL"
