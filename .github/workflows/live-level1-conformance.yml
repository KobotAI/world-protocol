name: Live Level 1 conformance

on:
  workflow_dispatch:
    inputs:
      world:
        description: World origin to test
        required: true
        default: https://life.kobotai.co
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - packages/worldkit-client/**
      - packages/worldkit-spec/**
      - packages/worldkit-testing/**
      - scripts/worldkit/check-live-level1.mjs
      - .github/workflows/live-level1-conformance.yml

permissions:
  contents: read

jobs:
  level-1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build conformance runner
        run: pnpm build
      - name: Check live World Protocol Level 1 conformance
        env:
          WORLD_URL: ${{ inputs.world || 'https://life.kobotai.co' }}
          WORLDKIT_CONFORMANCE_TIMEOUT_MS: '600000'
        run: node scripts/worldkit/check-live-level1.mjs "$WORLD_URL"
