$schema: https://api.gitbook.com/gitbook-docs.yaml

site:
  title: KobotAI Documentation
  structure:
    - type: section
      key: home
      title: KobotAI Documentation
      path: home
      default: true
      children:
        - type: space
          key: docs-home
          title: Documentation
          path: docs
          default: true
          content:
            directory: ./docs-home
            language: en
    - type: section
      key: world
      title: World Protocol and WorldDevKit
      path: world
      children:
        - type: space
          key: worlddevkit
          title: WorldDevKit
          path: worlddevkit
          default: true
          content:
            directory: ./
            language: en
